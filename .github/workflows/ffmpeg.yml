# Builds the FFmpeg that Media Converter ships (build/ffmpeg/build-ffmpeg.sh) on clean GitHub-hosted machines:
# Windows, a Mac with Apple silicon and an Intel Mac. Each build checks that it is self-contained and that every
# encoder the app uses works, before anything is kept.
#
# "Run workflow" on the Actions tab builds and tests; the results can be downloaded from the run page.
# With "publish" ticked it also publishes them as a pre-release named ffmpeg-<version>-mc<rev>, together with the
# complete source code. The app's own build scripts download those files and check them against pinned SHA-256s.
#
# Every action is pinned to a full commit SHA so its code can't change underneath this workflow.

name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the result as a pre-release (ffmpeg-<version>-mc<rev>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2 (UCRT64) with the compilers
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils perl zip git
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf

      - name: Build FFmpeg
        run: bash build/ffmpeg/build-ffmpeg.sh

      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffmpeg-windows
          path: build/ffmpeg/out/
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple silicon
            name: arm64
          - runner: macos-15-intel   # Intel
            name: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build tools
        run: |
          brew install nasm meson ninja pkgconf
          cmake --version | head -1

      - name: Build FFmpeg
        run: bash build/ffmpeg/build-ffmpeg.sh

      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffmpeg-mac-${{ matrix.name }}
          path: build/ffmpeg/out/*.zip
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [windows, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # publish the pre-release
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the files from all three builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Fingerprints
        run: |
          cd out
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Record build provenance (public repositories)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            out/*.zip
            out/*.tar.gz

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^FFMPEG_VERSION=//p' build/ffmpeg/build-ffmpeg.sh)
          rev=$(sed -n 's/^REV=\([0-9]*\).*/\1/p' build/ffmpeg/build-ffmpeg.sh)
          tag="ffmpeg-$version-mc$rev"
          cat > notes.md <<EOF
          FFmpeg $version built for Media Converter by [build/ffmpeg/build-ffmpeg.sh](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/build/ffmpeg/build-ffmpeg.sh) in [this workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          These are building blocks for the app's installers, not something to download on its own; get Media Converter from the [latest release](https://github.com/${{ github.repository }}/releases/latest).

          License: GNU GPL v3. The complete source code for these programs is ${tag}-sources.tar.gz.
          EOF
          gh release create "$tag" out/*.zip out/*.tar.gz out/SHA256SUMS.txt --target "${{ github.sha }}" \
            --title "FFmpeg $version for Media Converter (mc$rev)" --notes-file notes.md --prerelease --latest=false
