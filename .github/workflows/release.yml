# Builds Media Converter from this repository on clean GitHub-hosted machines: Windows, a Mac with Apple silicon
# and an Intel Mac. Each build is self-tested before anything is published.
#
# - Pushing a tag like v3.3.0 builds everything and publishes one GitHub Release with all files.
#   The release files are exactly what these public logs show being built from that commit.
# - "Run workflow" on the Actions tab builds and self-tests without publishing; the results can be
#   downloaded from the run page to compare with a release.
#
# Every action is pinned to a full commit SHA so its code can't change underneath this workflow.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Check the tag matches the app's version number
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}  # passed as data, never pasted into the script
        run: |
          $v = python -c "from converter import __version__; print(__version__)"
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match converter/__init__.py version $v" }

      - name: Build (build/build.ps1)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - name: Self-test the built app
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process dist\MediaConverter\MediaConverter.exe -ArgumentList "--self-test", $report -PassThru
          $p.WaitForExit()
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "The self-test failed" }

      - name: Show fingerprints and build record
        shell: pwsh
        run: Get-Content dist\BUILD-INFO.txt

      - name: Keep the files for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: |
            dist/MediaConverter-Setup.exe
            dist/MediaConverter-portable.zip
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          retention-days: 14

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple silicon
            arch: apple-silicon
          - runner: macos-15-intel   # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Build (build/build_mac.sh)
        run: bash build/build_mac.sh

      - name: Self-test the built app
        run: |
          report="$RUNNER_TEMP/selftest.json"
          status=0
          "dist/Media Converter.app/Contents/MacOS/MediaConverter" --self-test "$report" || status=$?
          cat "$report"
          exit $status

      - name: Open the app and check its window
        run: |
          log="$HOME/Library/Application Support/MediaConverter/log.txt"
          open -n "dist/Media Converter.app"
          sleep 25
          if ! pgrep -f "Media Converter.app/Contents/MacOS/MediaConverter" > /dev/null; then
            echo "The app quit by itself"; cat "$log" 2>/dev/null; exit 1
          fi
          screencapture -x "$RUNNER_TEMP/window-${{ matrix.arch }}.png"
          pkill -f "Media Converter.app/Contents/MacOS/MediaConverter" || true
          if [ -s "$log" ]; then cat "$log"; if grep -q "Traceback" "$log"; then echo "Errors while running"; exit 1; fi; fi
          echo "The window opened and ran without errors"

      - name: Keep the screenshot (not part of the release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screenshot-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/window-${{ matrix.arch }}.png
          retention-days: 7

      - name: Show fingerprints and build record
        run: cat dist/BUILD-INFO-mac-${{ matrix.arch }}.txt

      - name: Keep the files for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/MediaConverter-mac-${{ matrix.arch }}.dmg
            dist/SHA256SUMS-mac-${{ matrix.arch }}.txt
            dist/BUILD-INFO-mac-${{ matrix.arch }}.txt
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # publish the GitHub Release
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    steps:
      - name: Check out the source (for the release notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the files from all three builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Combine the fingerprints
        run: |
          cd dist
          cat SHA256SUMS.txt SHA256SUMS-mac-*.txt > SHA256SUMS-all.txt
          mv SHA256SUMS-all.txt SHA256SUMS.txt
          rm SHA256SUMS-mac-*.txt
          sha256sum -c SHA256SUMS.txt
          ls -la

      - name: Record build provenance (public repositories)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/MediaConverter-Setup.exe
            dist/MediaConverter-portable.zip
            dist/MediaConverter-mac-apple-silicon.dmg
            dist/MediaConverter-mac-intel.dmg

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/MediaConverter-Setup.exe dist/MediaConverter-portable.zip \
            dist/MediaConverter-mac-apple-silicon.dmg dist/MediaConverter-mac-intel.dmg \
            dist/SHA256SUMS.txt dist/BUILD-INFO.txt dist/BUILD-INFO-mac-apple-silicon.txt dist/BUILD-INFO-mac-intel.txt \
            --title "Media Converter $version" --notes-file "build/release-notes/$GITHUB_REF_NAME.md" --verify-tag
